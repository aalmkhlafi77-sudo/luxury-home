version: '3.8'

services:
  # =========================================================
  # App Service: Full-Stack Express Backend + React Vite Single Image
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ivoire_platform_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://ivoire_user:IvoireSecurePass2026@postgres:5432/ivoire_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_ivoire_2026_prod
      - UPLOAD_DIR=/app/uploads
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # =========================================================
  # Database Service: PostgreSQL 16
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: ivoire_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: ivoire_user
      POSTGRES_PASSWORD: IvoireSecurePass2026
      POSTGRES_DB: ivoire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivoire_user -d ivoire_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # Cache & Background Worker Queue Service: Redis 7
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: ivoire_platform_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # =========================================================
  # Reverse Proxy Service: Nginx
  # =========================================================
  nginx:
    image: nginx:alpine
    container_name: ivoire_platform_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_data:
